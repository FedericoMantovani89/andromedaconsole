options.git.init.tip=La cartella del progetto non è un repository git, e gli agenti ne hanno bisogno per avere un proprio ramo e worktree. Esegue git init -b main e crea un primo commit vuoto; nient'altro nella cartella viene toccato.
options.git.init.tip.holds=La cartella del progetto non è un repository git, e gli agenti ne hanno bisogno per avere un proprio ramo e worktree. Contiene però altri repository git: se ne avvii uno qui, diventa il repository del progetto e quelli che ci sono dentro vanno messi nel .gitignore. Esegue git init -b main e crea un primo commit vuoto; nient'altro nella cartella viene toccato.
options.git.try.title=Prova il ramo del progetto
options.git.try.tip=Prepara una copia del ramo del progetto per ogni repository, all'ultimo commit, nella cartella .andromedaconsole/try del progetto, così puoi compilare e provare l'integrazione (puntando un docker compose a queste cartelle, per esempio) senza toccare le tue copie di lavoro. La console non vi esegue nulla. Premilo di nuovo dopo nuovi merge per portarle all'ultimo commit: quello che è stato modificato al loro interno va perso. Rimuovi le cancella tramite git; i tuoi rami restano.
