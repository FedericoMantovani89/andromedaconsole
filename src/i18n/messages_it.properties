settings.testCommands.ticket=Comando di test per un ticket (facoltativo)
settings.testCommands.ticket.tip=Eseguito al passo di validazione dell'agente e di nuovo quando il ticket viene revisionato, nel worktree dell'agente. Qui conviene un comando veloce e mirato (per esempio: npm run test:ticket). Vuoto: si usa il comando di test qui sopra.
settings.testCommands.merge=Comando di test dopo un merge (facoltativo)
settings.testCommands.merge.tip=Eseguito nella cartella del progetto subito dopo l'unione di un ticket; se fallisce il merge viene annullato. Qui basta un insieme breve di prova (per esempio: npm run test:smoke). Vuoto: si usa il comando di test qui sopra.
settings.testCommands.release=Comando di test per un rilascio (facoltativo)
settings.testCommands.release.tip=Eseguito quando si prepara un rilascio e di nuovo dopo l'unione nel ramo di destinazione. Qui va la suite completa. Vuoto: si usa il comando di test qui sopra.
settings.repoTestCommand=Comando di test del repository {repo}
settings.repoTestCommand.tip=Eseguito per ogni ticket di {repo}, al posto dei comandi qui sopra: al passo di validazione, alla revisione, dopo un merge e per un rilascio. Vuoto: si usano i comandi qui sopra e, finché anche quelli sono vuoti, quello rilevato dai file di {repo} (mostrato nel campo; n/d se non è stato rilevato nulla).
settings.testCommand.tip.repos=La console esegue questo comando nel worktree dell'agente al passo di validazione, e di nuovo quando un ticket viene revisionato e unito (per esempio: npx vitest run). Questa cartella contiene più repository: il campo di un repository qui sotto, se compilato, si usa al posto di questo; finché sono vuoti entrambi, si usa il comando rilevato dai file di quel repository (mostrato nel suo campo).

