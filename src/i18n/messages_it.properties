settings.testCommand.tip.detected=La console esegue questo comando nel worktree dell'agente al passo di validazione, e di nuovo quando un ticket viene revisionato e unito (per esempio: npx vitest run). Se il campo è vuoto si usa quello rilevato dal progetto: {command}.
settings.testCommand.tip.none=La console esegue questo comando nel worktree dell'agente al passo di validazione, e di nuovo quando un ticket viene revisionato e unito (per esempio: npx vitest run). Dal progetto non è stato rilevato nulla (nessun pom.xml, build.gradle o package.json con uno script di test): senza un comando il passo di validazione non si può chiudere (a meno che inibisci i test per questo progetto).
