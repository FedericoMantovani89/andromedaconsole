settings.testCommands.ticket=Test command for a ticket (optional)
settings.testCommands.ticket.tip=Run at the agent's validation step and again when the ticket is reviewed, in the agent's worktree. Use a fast, pointed command here (for example: npm run test:ticket). Empty: the test command above is used.
settings.testCommands.merge=Test command after a merge (optional)
settings.testCommands.merge.tip=Run in the project folder right after a ticket is merged; if it fails the merge is undone. A short smoke set is enough here (for example: npm run test:smoke). Empty: the test command above is used.
settings.testCommands.release=Test command for a release (optional)
settings.testCommands.release.tip=Run when a release is prepared and again after it is merged into the target branch. This is the place for the full suite. Empty: the test command above is used.
settings.repoTestCommand=Test command of the repository {repo}
settings.repoTestCommand.tip=Run for every ticket of {repo}, in place of the commands above: at the validation step, at review, after a merge and for a release. Empty: the commands above are used, and while they are empty too, the one detected from the files of {repo} (shown in the field; n/a when nothing was detected).
settings.testCommand.tip.repos=The console runs this command in the agent's worktree at the validation step, and again when a ticket is reviewed and merged (for example: npx vitest run). This folder holds several repositories: while this field is empty, each repository uses its own field below, or the command detected from its own files (shown in that field).

