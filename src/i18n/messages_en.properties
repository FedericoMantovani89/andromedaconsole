options.git.init.title=Initialize git
options.git.init.apply=Run git init
options.git.init.tip=The project folder is not a git repository, and the agents need one to have a branch and a worktree of their own. It runs git init -b main and makes a first empty commit; nothing else in the folder is touched.
options.git.init.tip.holds=The project folder is not a git repository, and the agents need one to have a branch and a worktree of their own. It does hold other git repositories, though: if you start one here it becomes the project's repository and the ones inside belong in its .gitignore. It runs git init -b main and makes a first empty commit; nothing else in the folder is touched.
prereq.afterInstall=After installing a program, close the console and start it again from a new terminal: the console never reads the system PATH, it only uses the one it was started with.
