settings.testCommand.tip.detected=The console runs this command in the agent's worktree at the validation step, and again when a ticket is reviewed and merged (for example: npx vitest run). While the field is empty the one detected from the project is used: {command}.
settings.testCommand.tip.none=The console runs this command in the agent's worktree at the validation step, and again when a ticket is reviewed and merged (for example: npx vitest run). Nothing was detected from the project (no pom.xml, build.gradle or package.json with a test script): without a command the validation step cannot be closed (unless you inhibit the tests for this project).
