options.git.clone.help=Type the repository address (https, ssh or git@host:path). The project folder must be empty. No passwords go here: for a private repository use git's credential manager or an ssh key.
options.git.clone.done=Done: the project folder is now a clone of the repository.
error.git.cloneUrlInvalid=That address will not do: use https://..., ssh://... or git@host:path, with no spaces and no password.
