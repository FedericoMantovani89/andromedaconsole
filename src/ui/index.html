<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AndromedaConsole %VERSION%</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/xterm.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- No visible text here: every label is filled from the .properties bundles by main.ts (P12). -->
  <header id="topbar">
    <nav id="tabs"></nav>
    <div id="actions">
      <button id="requests-btn" type="button" hidden></button>
      <button id="queue-btn" type="button"></button>
      <button id="settings-btn" type="button"></button>
    </div>
  </header>
  <!-- One .project-ws (main column and agents column) per open project is added by main.ts. -->
  <main id="workspace"></main>
  <footer id="statusbar"></footer>
  <aside id="drawer" hidden></aside>
  <aside id="requests" hidden></aside>
  <aside id="reader" hidden></aside>
  <div id="overlay" hidden></div>
  <!-- Start-up splash (decorative: the name is in the picture; %VERSION% is filled in by the server). It never takes clicks or keys. -->
  <div id="splash" aria-hidden="true"><div class="splash-frame"><img src="/splash.jpg" alt=""><span id="splash-version">%VERSION%</span></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
