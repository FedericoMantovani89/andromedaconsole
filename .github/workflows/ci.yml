# The full test suite on GitHub, so it does not have to run on a laptop: every push to main and every pull request.
# Windows on purpose: the tests drive real node-pty children, real git and PowerShell, as the app does.
# Same pinning and read-only token as release.yml: nothing here can write to the repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A few minutes: the checks and the seven files that cover the server, merge, spawn, terminals, worktrees and the mod channel.
  # It runs next to the full suite, so a break in the basics is red long before the long run ends.
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the UI
        run: npm run build

      - name: Check (texts, literals, types)
        run: npm run check

      # The same seven files as `npm run test:smoke` (package.json), through the script that runs a crashed file again (see the `test` job).
      - name: Smoke tests
        shell: bash
        run: bash scripts/ci-tests.sh test/server.test.ts test/merge-ticket.test.ts test/spawn.test.ts test/pty-manager.test.ts test/git-worktree.test.ts test/v1.test.ts test/i18n-checks.test.ts
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  test:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check (texts, literals, types)
        run: npm run check

      # The server tests read the built UI.
      - name: Build the UI
        run: npm run build

      # A vitest worker that crashes natively (exit code 3221225477) leaves a minidump here through Windows Error Reporting; it is uploaded below,
      # so the module that crashes (node-pty, ConPTY) can be read from the dump instead of guessed.
      - name: Keep crash dumps
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 10 -PropertyType DWord -Force | Out-Null

      # The runner's default temp folder is in 8.3 form (C:\Users\RUNNER~1\...), while git answers with the long path: tests that compare
      # the two fail. The runner temp folder has no short names.
      # scripts/ci-tests.sh: if a worker dies with no test failing (a native crash of node-pty on this runner), the whole suite
      # runs once more; a failing test, or a second crash, fails the job.
      - name: Tests
        shell: bash
        run: bash scripts/ci-tests.sh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crash-dumps
          path: ${{ runner.temp }}/dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 14
